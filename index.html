<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criminal Law I Case Digests by PCGNG</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #0f172a; color: #f8fafc; }
    header { padding: 12px 24px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    header h1 { font-size: 1.15rem; color: #fde047; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button.nav-btn, label.upload-btn { padding: 8px 12px; border-radius: 6px; background: #334155; color: #fff; border: 1px solid #475569; cursor: pointer; font-size: 0.88rem; }
    button.nav-btn:hover, label.upload-btn:hover { background: #475569; }
    button.nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type="file"] { display: none; }
    .split-container { display: flex; flex: 1; overflow: hidden; }
    .pane { flex: 1; overflow-y: auto; padding: 24px; }
    .left-pane { border-right: 1px solid #334155; display: flex; justify-content: center; align-items: flex-start; background: #090d16; }
    .left-pane img { max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .right-pane { background: #1e293b; line-height: 1.7; }
    .digest-card { max-width: 760px; margin: 0 auto; background: #0f172a; padding: 28px; border-radius: 8px; border: 1px solid #334155; white-space: pre-wrap; font-size: 0.95rem; }
    .digest-card h1, .digest-card h2, .digest-card h3 { color: #fde047; margin-bottom: 8px; margin-top: 14px; }
    .digest-card strong { color: #38bdf8; }
    @media (max-width: 800px) { .split-container { flex-direction: column; } .left-pane { border-right: none; border-bottom: 1px solid #334155; } }
  </style>
</head>
<body>

  <header>
    <h1>⚖️ Criminal Law I Case Digests by PCGNG</h1>
    <div class="controls">
      <!-- Previous Case Arrow Button -->
      <button class="nav-btn" id="prevBtn" onclick="changeCase(-1)" title="Previous Case">◀ Prev</button>
      
      <select id="caseSelector" onchange="displaySelectedCase()">
        <option value="">Loading cases...</option>
      </select>

      <!-- Next Case Arrow Button -->
      <button class="nav-btn" id="nextBtn" onclick="changeCase(1)" title="Next Case">Next ▶</button>

      <label class="upload-btn">
        🖼️ Upload Image
        <input type="file" accept="image/*" onchange="uploadImage(event)">
      </label>
      <label class="upload-btn">
        📄 Upload Digest
        <input type="file" accept=".txt,.md" onchange="uploadDigest(event)">
      </label>
    </div>
  </header>

  <div class="split-container">
    <div class="pane left-pane">
      <img id="visualImage" src="" alt="Visual Case Digest">
    </div>
    <div class="pane right-pane">
      <div class="digest-card" id="digestContent">Select a case to view its digest.</div>
    </div>
  </div>

  <script>
    const USER = "PCGNG";
    const REPO = "labor-law-digests";
    let caseList = [];

    async function loadCases() {
      const selector = document.getElementById('caseSelector');
      try {
        const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/images`);
        if (!response.ok) throw new Error("Could not access images directory");
        const files = await response.json();

        const imageFiles = files.filter(f => /\.(jpg|jpeg|png|webp)$/i.test(f.name));

        if (imageFiles.length === 0) {
          selector.innerHTML = '<option>No images found</option>';
          return;
        }

        selector.innerHTML = '';
        caseList = imageFiles.map(img => {
          const rawName = img.name.replace(/\.[^/.]+$/, "");
          return {
            title: rawName,
            imgPath: img.path,
            digestPath: `digests/${rawName}.txt`
          };
        });

        caseList.forEach((item, index) => {
          const opt = document.createElement('option');
          opt.value = index;
          opt.textContent = item.title;
          selector.appendChild(opt);
        });

        displaySelectedCase();
      } catch (e) {
        selector.innerHTML = '<option>Failed to load cases</option>';
        console.error(e);
      }
    }

    async function displaySelectedCase() {
      const selector = document.getElementById('caseSelector');
      const idx = parseInt(selector.value);
      if (isNaN(idx) || !caseList[idx]) return;

      // Update arrow buttons disabled state at boundaries
      document.getElementById('prevBtn').disabled = (idx === 0);
      document.getElementById('nextBtn').disabled = (idx === caseList.length - 1);

      const item = caseList[idx];
      document.getElementById('visualImage').src = item.imgPath;

      const contentBox = document.getElementById('digestContent');
      contentBox.innerHTML = `<h2>${item.title}</h2><p style="color:#94a3b8;">Loading case digest file...</p>`;

      try {
        const res = await fetch(item.digestPath);
        if (!res.ok) throw new Error("File not found");
        const text = await res.text();
        contentBox.innerHTML = `<h2>${item.title}</h2><hr style="margin:12px 0; border-color:#334155;">` + marked.parse(text);
      } catch (err) {
        contentBox.innerHTML = `
          <h2>${item.title}</h2>
          <hr style="margin:12px 0; border-color:#334155;">
          <p style="color:#f87171;">Digest file not found at <code>${item.digestPath}</code></p>
          <p style="color:#94a3b8; font-size:0.9rem; margin-top:8px;">
            To display your written digest here, upload a text file named:<br>
            <b>${item.title}.txt</b> into your <b>digests/</b> folder on GitHub.
          </p>
        `;
      }
    }

    // Function to handle clicking the Prev / Next arrow buttons
    function changeCase(direction) {
      const selector = document.getElementById('caseSelector');
      let newIdx = parseInt(selector.value) + direction;
      if (newIdx >= 0 && newIdx < caseList.length) {
        selector.value = newIdx;
        displaySelectedCase();
      }
    }

    function uploadImage(event) {
      const file = event.target.files[0];
      if (file) document.getElementById('visualImage').src = URL.createObjectURL(file);
    }

    function uploadDigest(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('digestContent').innerHTML = `<h2>${file.name}</h2><hr style="margin:12px 0; border-color:#334155;">` + marked.parse(e.target.result);
        };
        reader.readAsText(file);
      }
    }

    loadCases();
  </script>
</body>
</html>
